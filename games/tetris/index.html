<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모던 테트리스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');

        body {
            background-color: #0f172a;
            font-family: 'Noto Sans KR', sans-serif;
            color: white;
            overflow: hidden;
            touch-action: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border: 4px solid #334155;
            border-radius: 8px;
            background-color: rgba(15, 23, 42, 0.8);
        }

        canvas {
            display: block;
            background-color: #020617;
        }

        /* 컨트롤 버튼 스타일 */
        .ctrl-btn {
            background: rgba(51, 65, 85, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .ctrl-btn:active {
            background: rgba(71, 85, 105, 0.8);
            transform: scale(0.95);
        }

        #overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .key-tag {
            background: #334155;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #fbbf24;
            font-weight: bold;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="flex flex-col lg:flex-row gap-8 items-start">
        <!-- 게임 보드 영역 -->
        <div id="game-container" class="relative">
            <canvas id="tetris" width="300" height="600"></canvas>

            <!-- 오버레이 -->
            <div id="overlay"
                class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 transition-opacity duration-300">
                <h1 id="overlay-title" class="text-4xl font-bold font-orbitron mb-4 text-blue-400">TETRIS</h1>
                <div id="overlay-msg" class="mb-6 text-slate-300 text-sm space-y-2">
                    <p><span class="key-tag">Space</span> 즉시 낙하 (Hard Drop)</p>
                    <p><span class="key-tag">↑</span> 블록 회전</p>
                    <p><span class="key-tag">← →</span> 이동 / <span class="key-tag">↓</span> 빠른 낙하</p>
                    <p><span class="key-tag">P</span> 일시 정지</p>
                </div>
                <button id="start-btn"
                    class="px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded-full font-bold transition-all transform hover:scale-105 active:scale-95 shadow-lg">
                    게임 시작
                </button>
            </div>
        </div>

        <!-- 정보 패널 -->
        <div class="flex flex-col gap-4 w-full md:w-56">
            <!-- 다음 블록 -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <h2 class="text-xs uppercase tracking-widest text-slate-400 mb-2 font-orbitron">NEXT</h2>
                <div class="flex justify-center bg-slate-900 rounded-lg p-2 h-20 items-center">
                    <canvas id="next" width="80" height="80"></canvas>
                </div>
            </div>

            <!-- 스코어 보드 -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 font-orbitron">
                <div class="grid grid-cols-2 lg:grid-cols-1 gap-2">
                    <div>
                        <h2 class="text-[10px] uppercase tracking-widest text-slate-400">SCORE</h2>
                        <p id="score" class="text-xl font-bold text-blue-400">0</p>
                    </div>
                    <div>
                        <h2 class="text-[10px] uppercase tracking-widest text-slate-400">LEVEL</h2>
                        <p id="level" class="text-xl font-bold text-purple-400">1</p>
                    </div>
                    <div>
                        <h2 class="text-[10px] uppercase tracking-widest text-slate-400">LINES</h2>
                        <p id="lines" class="text-xl font-bold text-emerald-400">0</p>
                    </div>
                </div>
            </div>

            <!-- 조작 가이드 -->
            <div
                class="hidden lg:block bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 text-[11px] text-slate-400 space-y-2">
                <h3 class="font-bold text-slate-300 mb-1 font-orbitron">CONTROLS</h3>
                <div class="flex justify-between"><span>즉시 낙하</span> <span
                        class="text-yellow-500 font-bold">Space</span></div>
                <div class="flex justify-between"><span>블록 회전</span> <span class="text-yellow-500 font-bold">↑</span>
                </div>
                <div class="flex justify-between"><span>좌우 이동</span> <span class="text-yellow-500 font-bold">← →</span>
                </div>
                <div class="flex justify-between"><span>빠른 낙하</span> <span class="text-yellow-500 font-bold">↓</span>
                </div>
                <div class="flex justify-between"><span>일시 정지</span> <span class="text-yellow-500 font-bold">P</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 모바일 컨트롤러 -->
    <div class="mt-8 grid grid-cols-3 gap-2 md:hidden w-full max-w-xs">
        <div></div>
        <button class="ctrl-btn p-5 rounded-xl flex items-center justify-center" id="btn-up" title="Rotate">
            <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                </path>
            </svg>
        </button>
        <div></div>
        <button class="ctrl-btn p-5 rounded-xl flex items-center justify-center" id="btn-left">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>
        <button class="ctrl-btn p-5 rounded-xl flex items-center justify-center" id="btn-down">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <button class="ctrl-btn p-5 rounded-xl flex items-center justify-center" id="btn-right">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </button>
        <div class="col-span-3 mt-2">
            <button class="w-full ctrl-btn py-4 rounded-xl font-orbitron font-bold text-yellow-400" id="btn-space">HARD
                DROP (Space)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextContext = nextCanvas.getContext('2d');

        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const linesElement = document.getElementById('lines');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        context.scale(BLOCK_SIZE, BLOCK_SIZE);
        nextContext.scale(20, 20);

        const PIECES = {
            'I': { shape: [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]], color: '#00f0f0' },
            'L': { shape: [[0, 2, 0], [0, 2, 0], [0, 2, 2]], color: '#f0a000' },
            'J': { shape: [[0, 3, 0], [0, 3, 0], [3, 3, 0]], color: '#0000f0' },
            'O': { shape: [[4, 4], [4, 4]], color: '#f0f000' },
            'Z': { shape: [[5, 5, 0], [0, 5, 5], [0, 0, 0]], color: '#f00000' },
            'S': { shape: [[0, 6, 6], [6, 6, 0], [0, 0, 0]], color: '#00f000' },
            'T': { shape: [[0, 7, 0], [7, 7, 7], [0, 0, 0]], color: '#a000f0' }
        };

        const PIECE_TYPES = 'ILJOZST';

        let board = createMatrix(COLS, ROWS);
        let player = {
            pos: { x: 0, y: 0 },
            matrix: null,
            color: '',
            next: null
        };

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let score = 0;
        let lines = 0;
        let level = 1;
        let paused = true;
        let gameOver = false;

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            return {
                matrix: PIECES[type].shape,
                color: PIECES[type].color
            };
        }

        function draw() {
            context.fillStyle = '#020617';
            context.fillRect(0, 0, canvas.width, canvas.height);

            context.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            context.lineWidth = 0.05;
            for (let x = 0; x <= COLS; x++) {
                context.beginPath(); context.moveTo(x, 0); context.lineTo(x, ROWS); context.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                context.beginPath(); context.moveTo(0, y); context.lineTo(COLS, y); context.stroke();
            }

            drawMatrix(board, { x: 0, y: 0 }, context);

            if (player.matrix && !paused) {
                const ghostPos = getGhostPosition();
                drawMatrix(player.matrix, ghostPos, context, player.color, true);
                drawMatrix(player.matrix, player.pos, context, player.color);
            }

            drawNext();
        }

        function drawMatrix(matrix, offset, ctx, colorOverride = null, isGhost = false) {
            if (!matrix) return;

            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        let color;
                        if (isGhost) {
                            color = 'rgba(255, 255, 255, 0.15)';
                        } else {
                            color = colorOverride || (Object.values(PIECES)[value - 1] ? Object.values(PIECES)[value - 1].color : '#fff');
                        }

                        ctx.fillStyle = color;
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);

                        if (!isGhost) {
                            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                            ctx.lineWidth = 0.05;
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                            ctx.fillRect(x + offset.x + 0.1, y + offset.y + 0.1, 0.8, 0.1);
                        } else {
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                            ctx.lineWidth = 0.05;
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        }
                    }
                });
            });
        }

        function getGhostPosition() {
            const ghost = {
                pos: { x: player.pos.x, y: player.pos.y },
                matrix: player.matrix
            };
            while (!collide(board, ghost)) {
                ghost.pos.y++;
            }
            ghost.pos.y--;
            return ghost.pos;
        }

        function drawNext() {
            nextContext.fillStyle = '#0f172a';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (!player.next) return;

            const nextPiece = PIECES[player.next];
            const matrix = nextPiece.shape;
            const offsetX = (nextCanvas.width / 20 - matrix[0].length) / 2;
            const offsetY = (nextCanvas.height / 20 - matrix.length) / 2;

            drawMatrix(matrix, { x: offsetX, y: offsetY }, nextContext, nextPiece.color);
        }

        function merge(board, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        const typeIndex = PIECE_TYPES.indexOf(PIECE_TYPES.split('').find(t => PIECES[t].color === player.color)) + 1;
                        board[y + player.pos.y][x + player.pos.x] = typeIndex;
                    }
                });
            });
        }

        function collide(board, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                        (board[y + o.y] === undefined || board[y + o.y][x + o.x] === undefined ||
                            board[y + o.y][x + o.x] !== 0)) {
                        return true;
                    }
                }
            }
            return false;
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerDrop() {
            if (paused || !player.matrix) return;
            player.pos.y++;
            if (collide(board, player)) {
                player.pos.y--;
                merge(board, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            if (paused || !player.matrix || gameOver) return;
            while (!collide(board, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(board, player);
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
            draw();
        }

        function playerMove(dir) {
            if (paused || !player.matrix) return;
            player.pos.x += dir;
            if (collide(board, player)) {
                player.pos.x -= dir;
            }
        }

        function playerRotate(dir) {
            if (paused || !player.matrix) return;
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(board, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function playerReset() {
            if (!player.next) {
                player.next = PIECE_TYPES[PIECE_TYPES.length * Math.random() | 0];
            }

            const type = player.next;
            const piece = createPiece(type);
            player.matrix = piece.matrix;
            player.color = piece.color;
            player.next = PIECE_TYPES[PIECE_TYPES.length * Math.random() | 0];

            player.pos.y = 0;
            player.pos.x = (board[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(board, player)) {
                gameOver = true;
                paused = true;
                overlayTitle.innerText = 'GAME OVER';
                overlayMsg.innerHTML = `<p class="mb-2">최종 점수: ${score}</p><p class="text-xs text-slate-400">버튼을 눌러 다시 도전하세요</p>`;
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';
            }
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = board.length - 1; y > 0; --y) {
                for (let x = 0; x < board[y].length; ++x) {
                    if (board[y][x] === 0) continue outer;
                }
                const row = board.splice(y, 1)[0].fill(0);
                board.unshift(row);
                ++y;
                score += rowCount * 100;
                lines += 1;
                rowCount *= 2;

                if (lines >= level * 10) {
                    level++;
                    dropInterval = Math.max(100, 1000 - (level - 1) * 100);
                }
            }
        }

        function updateScore() {
            scoreElement.innerText = score.toLocaleString();
            levelElement.innerText = level;
            linesElement.innerText = lines;
        }

        function update(time = 0) {
            if (paused) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function startGame() {
            board = createMatrix(COLS, ROWS);
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 1000;
            gameOver = false;
            paused = false;
            player.next = PIECE_TYPES[PIECE_TYPES.length * Math.random() | 0];
            playerReset();
            updateScore();
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            lastTime = performance.now();
            update();
        }

        function togglePause() {
            if (gameOver) return;
            paused = !paused;
            if (!paused) {
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
                lastTime = performance.now();
                update();
            } else {
                overlayTitle.innerText = 'PAUSED';
                overlayMsg.innerHTML = '<p class="mb-2">P 키를 눌러 계속하기</p>';
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';
            }
        }

        // 키보드 이벤트 수정 (사용자 요청 반영)
        document.addEventListener('keydown', event => {
            if (event.keyCode === 37) playerMove(-1); // Left
            else if (event.keyCode === 39) playerMove(1);  // Right
            else if (event.keyCode === 40) playerDrop();   // Down
            else if (event.keyCode === 38) { // Up -> 블록 회전 (Rotate)
                event.preventDefault();
                playerRotate(1);
            }
            else if (event.keyCode === 80) togglePause(); // P
            else if (event.keyCode === 32) { // SPACE -> 즉시 낙하 (Hard Drop)
                event.preventDefault();
                playerHardDrop();
            }
            draw();
        });

        startBtn.addEventListener('click', startGame);

        // 모바일 컨트롤 이벤트 수정 (사용자 요청 반영)
        const addMobileEvent = (id, fn) => {
            document.getElementById(id).addEventListener('pointerdown', (e) => {
                e.preventDefault();
                fn();
                draw();
            });
        };

        addMobileEvent('btn-left', () => playerMove(-1));
        addMobileEvent('btn-right', () => playerMove(1));
        addMobileEvent('btn-down', () => playerDrop());
        addMobileEvent('btn-up', () => playerRotate(1)); // 모바일 화살표 위 버튼 -> 블록 회전
        addMobileEvent('btn-space', () => playerHardDrop()); // 모바일 넓은 버튼 -> 즉시 낙하

        // 초기 드로잉
        draw();
    </script>
</body>

</html>
