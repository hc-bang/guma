<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이버 스네이크</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');

        body {
            background-color: #020617;
            font-family: 'Noto Sans KR', sans-serif;
            color: white;
            overflow: hidden;
            touch-action: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.2);
            border: 4px solid #064e3b;
            border-radius: 12px;
            background-color: rgba(2, 6, 23, 0.9);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        /* 네온 효과 */
        .neon-text-green {
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.8), 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .ctrl-btn {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
        }

        .ctrl-btn:active {
            background: rgba(16, 185, 129, 0.4);
            transform: scale(0.95);
        }

        #overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        .key-tag {
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #10b981;
            font-weight: bold;
            border: 1px solid #064e3b;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="flex flex-col lg:flex-row gap-8 items-center">
        <!-- 게임 화면 영역 -->
        <div id="game-container" class="relative">
            <canvas id="snakeGame"></canvas>

            <!-- 오버레이 (시작/게임종료) -->
            <div id="overlay"
                class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 transition-opacity duration-300">
                <h1 id="overlay-title"
                    class="text-5xl font-bold font-orbitron mb-4 text-emerald-500 neon-text-green uppercase">Snake</h1>
                <div id="overlay-msg" class="mb-8 text-slate-400 text-sm space-y-3">
                    <p>방향키 <span class="key-tag">↑</span> <span class="key-tag">↓</span> <span class="key-tag">←</span>
                        <span class="key-tag">→</span> 로 이동하세요.</p>
                    <p>음식을 먹을수록 몸이 길어지고 속도가 빨라집니다.</p>
                    <p><span class="key-tag">P</span> 키로 일시 정지할 수 있습니다.</p>
                </div>
                <button id="start-btn"
                    class="px-10 py-4 bg-emerald-600 hover:bg-emerald-500 rounded-full font-bold transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(16,185,129,0.5)] font-orbitron tracking-widest uppercase">
                    Game Start
                </button>
            </div>
        </div>

        <!-- 상태창 영역 -->
        <div class="flex flex-col gap-4 w-full md:w-64">
            <div class="bg-slate-900/80 p-6 rounded-2xl border border-emerald-900/50 shadow-inner">
                <div class="mb-6">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-emerald-500/70 mb-1 font-orbitron">Current Score
                    </h2>
                    <p id="score" class="text-4xl font-bold text-white leading-none font-orbitron">0</p>
                    <p class="text-[10px] text-slate-500 mt-1">현재 점수</p>
                </div>
                <div class="mb-6">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-emerald-500/70 mb-1 font-orbitron">High Score
                    </h2>
                    <p id="high-score" class="text-2xl font-bold text-slate-400 leading-none font-orbitron">0</p>
                    <p class="text-[10px] text-slate-500 mt-1">최고 기록</p>
                </div>
                <div class="pt-4 border-t border-emerald-900/30">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-emerald-500/70 mb-1 font-orbitron">Difficulty
                    </h2>
                    <p id="level" class="text-xl font-bold text-emerald-400 font-orbitron">LV. 1</p>
                    <p class="text-[10px] text-slate-500 mt-1">난이도</p>
                </div>
            </div>

            <!-- 미니 도움말 -->
            <div
                class="hidden lg:block bg-slate-900/40 p-4 rounded-xl border border-slate-800 text-[11px] text-slate-500 leading-relaxed">
                <p>● 자신의 몸이나 벽에 부딪히면 게임이 종료됩니다.</p>
                <p>● 음식을 먹으면 이동 속도가 점차 증가합니다.</p>
            </div>
        </div>
    </div>

    <!-- 모바일 컨트롤러 -->
    <div class="mt-8 grid grid-cols-3 gap-3 md:hidden w-full max-w-[280px]">
        <div></div>
        <button class="ctrl-btn p-6 rounded-2xl flex items-center justify-center shadow-lg" id="btn-up">
            <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
            </svg>
        </button>
        <div></div>
        <button class="ctrl-btn p-6 rounded-2xl flex items-center justify-center shadow-lg" id="btn-left">
            <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>
        <button class="ctrl-btn p-6 rounded-2xl flex items-center justify-center shadow-lg" id="btn-down">
            <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <button class="ctrl-btn p-6 rounded-2xl flex items-center justify-center shadow-lg" id="btn-right">
            <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </button>
    </div>

    <script>
        const canvas = document.getElementById('snakeGame');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('high-score');
        const levelDisplay = document.getElementById('level');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');

        // 게임 설정
        const gridSize = 20;
        let tileCountX, tileCountY;

        let snake = [];
        let food = { x: 10, y: 10 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;

        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameSpeed = 100;
        let gameLoop;
        let isPaused = true;
        let isGameOver = false;

        function initCanvas() {
            // 반응형 캔버스 크기 조절
            const containerWidth = Math.min(window.innerWidth - 40, 600);
            const containerHeight = Math.min(window.innerHeight - 300, 600);

            canvas.width = Math.floor(containerWidth / gridSize) * gridSize;
            canvas.height = Math.floor(containerHeight / gridSize) * gridSize;

            tileCountX = canvas.width / gridSize;
            tileCountY = canvas.height / gridSize;
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        highScoreDisplay.innerText = highScore;

        function startGame() {
            snake = [
                { x: Math.floor(tileCountX / 2), y: Math.floor(tileCountY / 2) },
                { x: Math.floor(tileCountX / 2), y: Math.floor(tileCountY / 2) + 1 },
                { x: Math.floor(tileCountX / 2), y: Math.floor(tileCountY / 2) + 2 }
            ];

            dx = 0;
            dy = -1;
            nextDx = 0;
            nextDy = -1;

            score = 0;
            gameSpeed = 120;
            isGameOver = false;
            isPaused = false;

            updateScore();
            createFood();

            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';

            if (gameLoop) clearTimeout(gameLoop);
            main();
        }

        function main() {
            if (isPaused) return;

            if (didGameEnd()) {
                endGame();
                return;
            }

            gameLoop = setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, gameSpeed);
        }

        function clearCanvas() {
            // 배경 그리기 (미세한 격자 효과)
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#064e3b22';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                const isHead = index === 0;
                ctx.fillStyle = isHead ? '#10b981' : '#065f46';

                // 둥근 사각형으로 뱀 파츠 그리기
                const x = part.x * gridSize;
                const y = part.y * gridSize;
                const r = isHead ? 6 : 4;

                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, gridSize - 2, gridSize - 2, r);
                ctx.fill();

                // 머리일 경우 눈 그리기
                if (isHead) {
                    ctx.fillStyle = 'white';
                    if (dx === 1) { // Right
                        ctx.fillRect(x + 14, y + 5, 2, 2); ctx.fillRect(x + 14, y + 13, 2, 2);
                    } else if (dx === -1) { // Left
                        ctx.fillRect(x + 4, y + 5, 2, 2); ctx.fillRect(x + 4, y + 13, 2, 2);
                    } else if (dy === -1) { // Up
                        ctx.fillRect(x + 5, y + 4, 2, 2); ctx.fillRect(x + 13, y + 4, 2, 2);
                    } else { // Down
                        ctx.fillRect(x + 5, y + 14, 2, 2); ctx.fillRect(x + 13, y + 14, 2, 2);
                    }
                }
            });
        }

        function advanceSnake() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const didEatFood = snake[0].x === food.x && snake[0].y === food.y;
            if (didEatFood) {
                score += 10;
                updateScore();
                createFood();
                // 속도 증가 (최소 50ms까지)
                gameSpeed = Math.max(50, 120 - Math.floor(score / 50) * 5);
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            // 벽 충돌
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCountX;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCountY;

            if (hitLeftWall || hitRightWall || hitTopWall || hitBottomWall) return true;

            // 몸 충돌
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            return false;
        }

        function createFood() {
            food.x = Math.floor(Math.random() * tileCountX);
            food.y = Math.floor(Math.random() * tileCountY);

            // 뱀 위에 생기지 않도록 재확인
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) createFood();
            });
        }

        function drawFood() {
            const x = food.x * gridSize + gridSize / 2;
            const y = food.y * gridSize + gridSize / 2;

            // 음식 네온 효과
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f43f5e';
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(x, y, gridSize / 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function updateScore() {
            scoreDisplay.innerText = score;
            const level = Math.floor(score / 100) + 1;
            levelDisplay.innerText = `LV. ${level}`;

            if (score > highScore) {
                highScore = score;
                highScoreDisplay.innerText = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }
        }

        function endGame() {
            isGameOver = true;
            isPaused = true;
            overlayTitle.innerText = 'Game Over';
            overlayTitle.classList.replace('text-emerald-500', 'text-rose-500');
            overlayTitle.style.textShadow = '0 0 10px rgba(244, 63, 94, 0.8)';
            overlayMsg.innerHTML = `<p class="text-xl text-white">최종 점수: ${score}</p><p class="text-slate-400">당신의 한계에 다시 도전하세요.</p>`;
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            if (!isPaused) {
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
                main();
            } else {
                overlayTitle.innerText = '일시 정지';
                overlayMsg.innerHTML = '<p>게임을 계속하려면 P 키를 누르세요.</p>';
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';
            }
        }

        // 키보드 제어
        document.addEventListener('keydown', e => {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;
            const P_KEY = 80;

            const keyPressed = e.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT_KEY && !goingRight) { nextDx = -1; nextDy = 0; }
            if (keyPressed === UP_KEY && !goingDown) { nextDx = 0; nextDy = -1; }
            if (keyPressed === RIGHT_KEY && !goingLeft) { nextDx = 1; nextDy = 0; }
            if (keyPressed === DOWN_KEY && !goingUp) { nextDx = 0; nextDy = 1; }
            if (keyPressed === P_KEY) togglePause();
        });

        // 모바일 제어
        const handleBtn = (newDx, newDy) => {
            if (isPaused || isGameOver) return;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (newDx === -1 && !goingRight) { nextDx = -1; nextDy = 0; }
            if (newDy === -1 && !goingDown) { nextDx = 0; nextDy = -1; }
            if (newDx === 1 && !goingLeft) { nextDx = 1; nextDy = 0; }
            if (newDy === 1 && !goingUp) { nextDx = 0; nextDy = 1; }
        };

        document.getElementById('btn-left').addEventListener('pointerdown', () => handleBtn(-1, 0));
        document.getElementById('btn-right').addEventListener('pointerdown', () => handleBtn(1, 0));
        document.getElementById('btn-up').addEventListener('pointerdown', () => handleBtn(0, -1));
        document.getElementById('btn-down').addEventListener('pointerdown', () => handleBtn(0, 1));

        startBtn.addEventListener('click', startGame);

        // 초기 화면 렌더링
        clearCanvas();
        drawSnake();
    </script>
</body>

</html>
