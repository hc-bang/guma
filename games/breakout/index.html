<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이버 브레이크아웃</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');

        body {
            background-color: #020617;
            font-family: 'Noto Sans KR', sans-serif;
            color: white;
            overflow: hidden;
            touch-action: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.2);
            border: 4px solid #1e3a8a;
            border-radius: 12px;
            background-color: rgba(2, 6, 23, 0.9);
        }

        canvas {
            display: block;
            pointer-events: none;
            /* 마우스 이벤트 완전 차단 */
        }

        /* 네온 텍스트 효과 */
        .neon-text-blue {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.4);
        }

        #overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        .key-tag {
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #60a5fa;
            font-weight: bold;
            border: 1px solid #1e3a8a;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="flex flex-col lg:flex-row gap-8 items-center">
        <!-- 게임 화면 영역 -->
        <div id="game-container" class="relative">
            <canvas id="breakoutGame"></canvas>

            <!-- 오버레이 -->
            <div id="overlay"
                class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 transition-opacity duration-300">
                <h1 id="overlay-title"
                    class="text-4xl font-bold font-orbitron mb-4 text-blue-500 neon-text-blue uppercase tracking-tighter">
                    Breakout</h1>
                <div id="overlay-msg" class="mb-8 text-slate-400 text-sm space-y-3 leading-relaxed">
                    <p>방향키 <span class="key-tag">←</span> <span class="key-tag">→</span> 로 바를 조절하고, <span
                            class="key-tag">Enter</span> 로 시작하세요.</p>
                    <p>시작 후 <span class="key-tag">Space</span> 를 눌러야 공이 발사됩니다.</p>
                    <p>모든 벽돌을 제거하면 다음 단계로 넘어갑니다.</p>
                    <p><span class="key-tag">P</span> 키로 일시 정지할 수 있습니다.</p>
                </div>
                <button id="start-btn"
                    class="px-10 py-4 bg-blue-600 hover:bg-blue-500 rounded-full font-bold transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(59,130,246,0.5)] font-orbitron tracking-widest uppercase">
                    Initialize Game
                </button>
            </div>
        </div>

        <!-- 정보 패널 -->
        <div class="flex flex-col gap-4 w-full md:w-64">
            <div class="bg-slate-900/80 p-6 rounded-2xl border border-blue-900/50 shadow-inner">
                <div class="mb-6">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-blue-500/70 mb-1 font-orbitron">Total Score</h2>
                    <p id="score" class="text-4xl font-bold text-white leading-none font-orbitron">0</p>
                    <p class="text-[10px] text-slate-500 mt-1">현재 점수</p>
                </div>
                <div class="mb-6">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-blue-500/70 mb-1 font-orbitron">Lives</h2>
                    <div id="lives-container" class="flex gap-2 mt-2">
                        <!-- 생명 아이콘이 여기에 동적으로 추가됨 -->
                    </div>
                    <p class="text-[10px] text-slate-500 mt-1">남은 생명</p>
                </div>
                <div class="pt-4 border-t border-blue-900/30">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-blue-500/70 mb-1 font-orbitron">Phase</h2>
                    <p id="level" class="text-xl font-bold text-blue-400 font-orbitron">PHASE 1</p>
                    <p class="text-[10px] text-slate-500 mt-1">단계</p>
                </div>
            </div>

            <div
                class="hidden lg:block bg-slate-900/40 p-4 rounded-xl border border-slate-800 text-[11px] text-slate-500 leading-relaxed">
                <p>● 공을 놓치면 생명이 하나 줄어듭니다.</p>
                <p>● 벽돌의 색상에 따라 점수가 다릅니다.</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('breakoutGame');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const livesContainer = document.getElementById('lives-container');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');

        // 게임 설정
        let canvasWidth = 480;
        let canvasHeight = 640;

        let ballRadius = 8;
        let x, y, dx, dy;

        const paddleHeight = 12;
        let paddleWidth = 90;
        let paddleX;

        let rightPressed = false;
        let leftPressed = false;

        const brickRowCount = 8;
        const brickColumnCount = 5;
        const brickPadding = 10;
        const brickOffsetTop = 50;
        const brickOffsetLeft = 25;
        let brickWidth;
        const brickHeight = 20;

        let bricks = [];
        let score = 0;
        let lives = 3;
        let level = 1;
        let isPaused = true;
        let isGameOver = false;
        let ballLaunched = false;

        function initCanvas() {
            const containerWidth = Math.min(window.innerWidth - 40, 480);
            canvas.width = containerWidth;
            canvas.height = 640;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;

            paddleX = (canvasWidth - paddleWidth) / 2;
            brickWidth = (canvasWidth - (brickOffsetLeft * 2) - (brickPadding * (brickColumnCount - 1))) / brickColumnCount;

            // 초기 로드 시에도 그리기가 가능하도록 데이터 생성
            initBricks();
            resetBall();
        }

        function resetBall() {
            ballLaunched = false;
            x = paddleX + paddleWidth / 2;
            y = canvasHeight - paddleHeight - 10 - ballRadius;
            const speed = 3 + level;
            dx = speed * (Math.random() > 0.5 ? 1 : -1);
            dy = -speed;
        }

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, color: getBrickColor(r) };
                }
            }
        }

        function getBrickColor(row) {
            const colors = ['#ef4444', '#f97316', '#f59e0b', '#10b981', '#3b82f6', '#6366f1', '#8b5cf6', '#d946ef'];
            return colors[row % colors.length];
        }

        function updateLivesDisplay() {
            livesContainer.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                const heart = document.createElement('div');
                heart.className = 'w-4 h-4 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]';
                livesContainer.appendChild(heart);
            }
        }

        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            isGameOver = false;
            isPaused = false;
            paddleWidth = 90;

            initBricks();
            updateScore();
            updateLivesDisplay();
            resetBall();

            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            startBtn.blur(); // 버튼 포커스 해제하여 키보드 간섭 방지

            draw();
        }

        function updateScore() {
            if (scoreDisplay) scoreDisplay.innerText = score.toLocaleString();
            if (levelDisplay) levelDisplay.innerText = `PHASE ${level}`;
        }

        // 충돌 감지
        function collisionDetection() {
            if (!bricks.length) return;
            for (let c = 0; c < brickColumnCount; c++) {
                if (!bricks[c]) continue;
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b && b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score += (brickRowCount - r) * 10;
                            updateScore();

                            if (checkLevelClear()) {
                                nextLevel();
                            }
                        }
                    }
                }
            }
        }

        function checkLevelClear() {
            for (let c = 0; c < brickColumnCount; c++) {
                if (!bricks[c]) continue;
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r] && bricks[c][r].status === 1) return false;
                }
            }
            return true;
        }

        function nextLevel() {
            level++;
            isPaused = true;
            paddleWidth = Math.max(50, 90 - (level * 5));
            initBricks();
            resetBall();

            overlayTitle.innerText = `PHASE ${level}`;
            overlayTitle.classList.replace('text-rose-500', 'text-blue-500');
            overlayMsg.innerHTML = '<p class="text-white">준비되셨나요? 다음 단계로 이동합니다.</p><p class="text-slate-400 text-xs mt-2">Space를 눌러 공을 발사하세요.</p>';
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';

            setTimeout(() => {
                isPaused = false;
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
                draw(); // 다음 레벨 루프 재시작
            }, 2000);
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#fff";
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddleX, canvasHeight - paddleHeight - 10, paddleWidth, paddleHeight, 6);
            ctx.fillStyle = "#3b82f6";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#3b82f6";
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawBricks() {
            if (!bricks.length) return;
            for (let c = 0; c < brickColumnCount; c++) {
                if (!bricks[c]) continue;
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b && b.status === 1) {
                        const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        b.x = brickX;
                        b.y = brickY;

                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
                        ctx.fillStyle = b.color;
                        ctx.fill();

                        ctx.fillStyle = "rgba(255,255,255,0.2)";
                        ctx.fillRect(brickX, brickY, brickWidth, 2);
                        ctx.closePath();
                    }
                }
            }
        }

        function draw() {
            if (isPaused || isGameOver) return;

            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // 배경 격자
            ctx.strokeStyle = "rgba(255,255,255,0.03)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvasWidth; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvasHeight); ctx.stroke();
            }
            for (let j = 0; j < canvasHeight; j += 40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvasWidth, j); ctx.stroke();
            }

            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            if (x + dx > canvasWidth - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }
            if (y + dy < ballRadius) {
                dy = -dy;
            } else if (y + dy > canvasHeight - ballRadius - 10 - paddleHeight) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    let hitPos = (x - (paddleX + paddleWidth / 2)) / (paddleWidth / 2);
                    dx = hitPos * (4 + level);
                    dy = -dy;
                } else if (y + dy > canvasHeight - ballRadius) {
                    lives--;
                    updateLivesDisplay();
                    if (!lives) {
                        endGame();
                        return;
                    } else {
                        resetBall();
                    }
                }
            }

            if (rightPressed && paddleX < canvasWidth - paddleWidth) {
                paddleX += 8;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 8;
            }

            if (!ballLaunched) {
                x = paddleX + paddleWidth / 2;
                y = canvasHeight - paddleHeight - 10 - ballRadius;
            } else {
                x += dx;
                y += dy;
            }

            requestAnimationFrame(draw);
        }

        function endGame() {
            isGameOver = true;
            isPaused = true;
            overlayTitle.innerText = 'System Failure';
            overlayTitle.classList.replace('text-blue-500', 'text-rose-500');
            overlayTitle.style.textShadow = '0 0 10px rgba(244, 63, 94, 0.8)';
            overlayMsg.innerHTML = `<p class="text-xl text-white">최종 점수: ${score}</p><p class="text-slate-400">데이터가 손실되었습니다. 다시 시작하십시오.</p>`;
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            if (!isPaused) {
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
                draw();
            } else {
                overlayTitle.innerText = 'PAUSED';
                overlayMsg.innerHTML = '<p>중단됨. 계속하려면 P 키를 누르세요.</p>';
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = true;
                e.preventDefault();
            }
            else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = true;
                e.preventDefault();
            }
            else if (e.key === "p" || e.key === "P") {
                togglePause();
                e.preventDefault();
            }
            else if (e.key === "Enter" && (isGameOver || isPaused)) {
                if (isGameOver) startGame();
                else if (overlay.style.opacity === '1' && overlayTitle.innerText === 'Breakout') startGame();
                else togglePause();
                e.preventDefault();
            }
            else if (e.key === " " || e.key === "Spacebar") {
                if (!isPaused && !isGameOver && !ballLaunched) {
                    ballLaunched = true;
                }
                e.preventDefault();
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        });

        startBtn.addEventListener('click', (e) => {
            startGame();
            startBtn.blur();
        });

        // 전역 마우스/터치 이벤트 무시 (버튼 제외)
        window.addEventListener('mousedown', (e) => {
            if (e.target !== startBtn) e.preventDefault();
        }, { passive: false });
        window.addEventListener('touchstart', (e) => {
            if (e.target !== startBtn) e.preventDefault();
        }, { passive: false });
        window.addEventListener('mousemove', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        window.addEventListener('resize', initCanvas);

        // 실행 시점 조정
        window.onload = function () {
            initCanvas();
            updateLivesDisplay();
            drawBricks();
            drawPaddle();
        };
    </script>
</body>

</html>
