<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이버 인베이더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');

        body {
            background-color: #020617;
            font-family: 'Noto Sans KR', sans-serif;
            color: white;
            overflow: hidden;
            touch-action: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.2);
            border: 4px solid #4c1d95;
            border-radius: 12px;
            background-color: rgba(2, 6, 23, 0.9);
        }

        canvas {
            display: block;
        }

        .neon-text-purple {
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.8), 0 0 20px rgba(139, 92, 246, 0.4);
        }

        .ctrl-btn {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
        }

        .ctrl-btn:active {
            background: rgba(139, 92, 246, 0.4);
            transform: scale(0.95);
        }

        #overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        .key-tag {
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #a78bfa;
            font-weight: bold;
            border: 1px solid #4c1d95;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="flex flex-col lg:flex-row gap-8 items-center">
        <div id="game-container" class="relative">
            <canvas id="invadersGame"></canvas>

            <div id="overlay"
                class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 transition-opacity duration-300">
                <h1 id="overlay-title"
                    class="text-4xl font-bold font-orbitron mb-4 text-purple-400 neon-text-purple uppercase tracking-widest">
                    Invaders</h1>
                <div id="overlay-msg" class="mb-8 text-slate-400 text-sm space-y-3 leading-relaxed">
                    <p><span class="key-tag">←</span> <span class="key-tag">→</span> 이동 / <span
                            class="key-tag">Space</span> 발사</p>
                    <p>적들이 바닥에 닿기 전에 격추하세요!</p>
                    <p><span class="key-tag">P</span> 일시 정지</p>
                </div>
                <button id="start-btn"
                    class="px-10 py-4 bg-purple-600 hover:bg-purple-500 rounded-full font-bold transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(139,92,246,0.5)] font-orbitron tracking-widest uppercase">
                    Launch Mission
                </button>
            </div>
        </div>

        <div class="flex flex-col gap-4 w-full md:w-64">
            <div class="bg-slate-900/80 p-6 rounded-2xl border border-purple-900/50 shadow-inner">
                <div class="mb-6">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-purple-500/70 mb-1 font-orbitron">Score</h2>
                    <p id="score" class="text-4xl font-bold text-white leading-none font-orbitron">0</p>
                    <p class="text-[10px] text-slate-500 mt-1 font-orbitron">SCORE</p>
                </div>
                <div class="mb-6">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-purple-500/70 mb-1 font-orbitron">Shields</h2>
                    <div id="lives-container" class="flex gap-2 mt-2"></div>
                    <p class="text-[10px] text-slate-500 mt-1 font-orbitron">SHIELDS</p>
                </div>
                <div class="pt-4 border-t border-purple-900/30">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-purple-500/70 mb-1 font-orbitron">Wave</h2>
                    <p id="level" class="text-xl font-bold text-purple-400 font-orbitron">WAVE 1</p>
                    <p class="text-[10px] text-slate-500 mt-1 font-orbitron">WAVE</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-8 flex gap-4 md:hidden w-full max-w-xs">
        <button class="ctrl-btn flex-1 p-6 rounded-2xl flex items-center justify-center shadow-lg" id="btn-left">
            <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>
        <button class="ctrl-btn flex-1 p-6 rounded-2xl flex items-center justify-center shadow-lg bg-purple-900/40"
            id="btn-fire">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z">
                </path>
            </svg>
        </button>
        <button class="ctrl-btn flex-1 p-6 rounded-2xl flex items-center justify-center shadow-lg" id="btn-right">
            <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </button>
    </div>

    <script>
        const canvas = document.getElementById('invadersGame');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const livesContainer = document.getElementById('lives-container');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');

        let canvasWidth = 480;
        let canvasHeight = 600;

        let player = {
            width: 40,
            height: 20,
            x: 0,
            y: 0,
            speed: 5,
            color: '#a78bfa'
        };

        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let particles = []; // 폭발 효과용 파티클 배열
        let score = 0;
        let lives = 3;
        let level = 1;
        let isPaused = true;
        let isGameOver = false;
        let animationId = null;

        let rightPressed = false;
        let leftPressed = false;
        let lastFired = 0;
        const fireDelay = 250;

        let enemyDirection = 1;

        function initCanvas() {
            const containerWidth = Math.min(window.innerWidth - 40, 480);
            canvas.width = containerWidth;
            canvas.height = 600;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;

            player.x = (canvasWidth - player.width) / 2;
            player.y = canvasHeight - 40;
        }

        function createEnemies() {
            enemies = [];
            const rows = 4 + Math.floor(level / 2);
            const cols = 6;
            const padding = 20;
            const offsetTop = 60;
            const enemyWidth = 30;
            const enemyHeight = 20;

            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows; r++) {
                    const enemyX = c * (enemyWidth + padding) + (canvasWidth - (cols * (enemyWidth + padding))) / 2;
                    const enemyY = r * (enemyHeight + padding) + offsetTop;
                    enemies.push({
                        x: enemyX,
                        y: enemyY,
                        width: enemyWidth,
                        height: enemyHeight,
                        color: getEnemyColor(r),
                        points: (rows - r) * 10
                    });
                }
            }
            enemyDirection = 1;
        }

        function getEnemyColor(row) {
            const colors = ['#f472b6', '#a78bfa', '#60a5fa', '#34d399'];
            return colors[row % colors.length];
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 3 + 1,
                    life: 1.0,
                    decay: Math.random() * 0.05 + 0.02,
                    color: color
                });
            }
        }

        function updateLivesDisplay() {
            livesContainer.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                const shield = document.createElement('div');
                shield.className = 'w-4 h-2 rounded-sm bg-purple-500 shadow-[0_0_8px_rgba(167,139,250,0.6)]';
                livesContainer.appendChild(shield);
            }
        }

        function startGame() {
            if (animationId) cancelAnimationFrame(animationId);
            score = 0;
            lives = 3;
            level = 1;
            isGameOver = false;
            isPaused = false;
            bullets = [];
            enemyBullets = [];
            particles = [];
            createEnemies();
            updateScore();
            updateLivesDisplay();
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            gameLoop();
        }

        function updateScore() {
            scoreDisplay.innerText = score.toLocaleString();
            levelDisplay.innerText = `WAVE ${level}`;
        }

        function update() {
            if (isPaused || isGameOver) return;

            if (rightPressed && player.x < canvasWidth - player.width) player.x += player.speed;
            if (leftPressed && player.x > 0) player.x -= player.speed;

            // 총알 가시성 및 속도
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= 8;
                if (bullets[i].y < 0) bullets.splice(i, 1);
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                eb.y += 3.5 + (level * 0.4);
                if (eb.y > canvasHeight) {
                    enemyBullets.splice(i, 1);
                    continue;
                }
                if (eb.x > player.x && eb.x < player.x + player.width &&
                    eb.y > player.y && eb.y < player.y + player.height) {
                    enemyBullets.splice(i, 1);
                    createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#fff');
                    lives--;
                    updateLivesDisplay();
                    if (lives <= 0) endGame();
                }
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }

            let edgeReached = false;
            const enemySpeed = (0.35 + level * 0.2) * enemyDirection;

            for (let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i];
                enemy.x += enemySpeed;
                if (enemy.x + enemy.width > canvasWidth - 10 || enemy.x < 10) edgeReached = true;
                if (enemy.y + enemy.height > player.y) {
                    endGame();
                    return;
                }
            }

            if (edgeReached) {
                enemyDirection *= -1;
                enemies.forEach(enemy => { enemy.y += 15; });
            }

            if (Math.random() < 0.012 + (level * 0.005) && enemies.length > 0) {
                const shooter = enemies[Math.floor(Math.random() * enemies.length)];
                enemyBullets.push({ x: shooter.x + shooter.width / 2, y: shooter.y + shooter.height });
            }

            bulletLoop: for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (bullet.x > enemy.x && bullet.x < enemy.x + enemy.width &&
                        bullet.y > enemy.y && bullet.y < enemy.y + enemy.height) {

                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
                        score += enemy.points;
                        bullets.splice(i, 1);
                        enemies.splice(j, 1);
                        updateScore();

                        if (enemies.length === 0) nextLevel();
                        continue bulletLoop;
                    }
                }
            }
        }

        function nextLevel() {
            level++;
            isPaused = true;
            bullets = [];
            enemyBullets = [];
            createEnemies();
            overlayTitle.innerText = `WAVE ${level}`;
            overlayTitle.style.color = '#a78bfa';
            overlayMsg.innerHTML = '<p class="text-white">더 강력한 부대가 접근 중입니다!</p>';
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
            setTimeout(() => {
                if (isGameOver) return;
                isPaused = false;
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
            }, 2000);
        }

        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(enemy.x + 6, enemy.y + 4, 4, 4);
                ctx.fillRect(enemy.x + enemy.width - 10, enemy.y + 4, 4, 4);
            });
            ctx.shadowBlur = 0;
        }

        function drawBullets() {
            // 플레이어 총알 (시안색 글로우)
            ctx.fillStyle = '#00ffff';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00ffff';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x - 2, bullet.y, 4, 12);
            });

            // 적 총알 (빨간색 글로우)
            ctx.fillStyle = '#ff3333';
            ctx.shadowColor = '#ff3333';
            enemyBullets.forEach(eb => {
                ctx.fillRect(eb.x - 2, eb.y, 4, 10);
            });
            ctx.shadowBlur = 0;
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 5;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // 배경 별
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            for (let i = 0; i < 20; i++) {
                ctx.fillRect((Math.random() * canvasWidth), (Math.random() * canvasHeight), 1.5, 1.5);
            }

            drawEnemies();
            drawPlayer();
            drawBullets();
            drawParticles();
        }

        function gameLoop() {
            if (isGameOver) return;
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isGameOver = true;
            isPaused = true;
            cancelAnimationFrame(animationId);
            overlayTitle.innerText = 'MISSION FAILED';
            overlayTitle.style.color = '#ef4444';
            overlayMsg.innerHTML = `<p class="text-xl text-white">최종 점수: ${score}</p><p class="text-slate-400">지구가 점령당했습니다. 다시 시도하세요.</p>`;
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            if (!isPaused) {
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
            } else {
                overlayTitle.innerText = 'PAUSED';
                overlayMsg.innerHTML = '<p>작전 중단. 계속하려면 P 키를 누르세요.</p>';
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';
            }
        }

        function fireBullet() {
            if (isPaused || isGameOver) return;
            const now = Date.now();
            if (now - lastFired > fireDelay) {
                bullets.push({ x: player.x + player.width / 2, y: player.y });
                lastFired = now;
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
            else if (e.key === "p" || e.key === "P") togglePause();
            else if (e.key === " ") { e.preventDefault(); fireBullet(); }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        });

        const setBtn = (id, actionDown, actionUp) => {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); actionDown(); });
            if (actionUp) {
                btn.addEventListener('pointerup', (e) => { e.preventDefault(); actionUp(); });
                btn.addEventListener('pointerleave', (e) => { e.preventDefault(); actionUp(); });
            }
        };

        setBtn('btn-left', () => { leftPressed = true; }, () => { leftPressed = false; });
        setBtn('btn-right', () => { rightPressed = true; }, () => { rightPressed = false; });
        setBtn('btn-fire', () => { fireBullet(); });

        startBtn.addEventListener('click', startGame);
        window.addEventListener('resize', initCanvas);
        window.onload = function () {
            initCanvas();
            updateLivesDisplay();
            drawPlayer();
        };
    </script>
</body>

</html>
