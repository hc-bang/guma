<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUMA™ YouTube</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../config/config.css">
  <style>
    .yt-container {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px 14px 32px;
    }

    .yt-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .yt-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .yt-input-wrapper {
      position: relative;
      flex: 1;
    }

    .yt-input {
      width: 100%;
      height: 36px;
      padding: 0 32px 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color var(--trans, 0.18s), box-shadow var(--trans, 0.18s);
    }

    .yt-input:focus {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .yt-clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      display: none;
    }

    .yt-btn-analyze {
      padding: 7px 14px;
      min-height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .18s, border-color .18s;
    }

    .yt-btn-analyze:hover {
      background: var(--btnHover, var(--btn-hover));
    }

    .yt-btn-analyze:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Result Card */
    .yt-card {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .yt-card-content {
      display: flex;
      gap: 20px;
    }

    @media (max-width: 640px) {
      .yt-card-content {
        flex-direction: column;
      }

      .yt-input-group {
        flex-direction: column;
      }

      .yt-thumb {
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 16 / 9;
      }

      .yt-actions {
        flex-direction: column;
        width: 100%;
      }

      .yt-dl-btn {
        width: 100% !important;
        flex: 1 1 auto !important;
      }

      .yt-channel-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)) !important;
        gap: 10px !important;
      }
    }

    .yt-thumb {
      width: 220px;
      height: 124px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .yt-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .yt-info-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 8px;
      color: var(--text);
    }

    .yt-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 14px;
    }

    .yt-quality-badge {
      background: color-mix(in srgb, var(--accent) 15%, var(--btn));
      border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
      color: var(--accent);
      font-weight: 700;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .yt-actions {
      display: flex;
      gap: 10px;
    }

    .yt-dl-btn {
      flex: 0 0 130px;
      width: 130px;
      padding: 7px 12px;
      min-height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s, border-color .18s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .yt-dl-btn:hover {
      background: var(--btnHover, var(--btn-hover));
    }

    .yt-dl-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Channel Section */
    .yt-channel-section {
      margin-top: 6px;
    }

    .yt-channel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .yt-channel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Modal (Internal Popup) Overlay */
    .yt-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    .yt-modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .yt-modal-dialog {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      transform: scale(0.95);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
    }

    .yt-modal-overlay.open .yt-modal-dialog {
      transform: scale(1);
    }

    .yt-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .yt-modal-heading {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .yt-modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 8px;
      transition: color .18s, background .18s;
    }

    .yt-modal-close:hover {
      color: var(--text);
      background: var(--btnHover, var(--btn-hover));
    }

    .yt-header-action-btn {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .18s ease;
      white-space: nowrap;
    }

    .yt-header-action-btn:hover {
      background: var(--btnHover, var(--btn-hover));
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
      color: var(--accent);
    }

    .yt-channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .yt-ch-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color .18s, transform .18s;
      cursor: pointer;
    }

    .yt-ch-card:hover {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
      transform: translateY(-2px);
    }

    .yt-thumb-wrap {
      position: relative;
      width: 100%;
      height: 94px;
      margin-bottom: 8px;
    }

    .yt-ch-thumb {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      object-fit: cover;
      display: block;
      border: 1px solid var(--border);
    }

    .yt-ch-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .yt-ch-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .yt-ch-meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 0;
      display: flex;
      justify-content: space-between;
    }

    .yt-channel-loading {
      color: var(--muted);
      font-size: 13px;
      grid-column: 1 / -1;
      padding: 16px 0;
      text-align: center;
    }

    .yt-btn-load-more {
      padding: 9px 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .18s, border-color .18s, transform .18s;
      box-shadow: var(--shadow-sm);
    }

    .yt-btn-load-more:hover {
      background: var(--btnHover, var(--btn-hover));
      border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
      transform: translateY(-1px);
    }

    .yt-btn-load-more:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Channel Management Tabs */
    .yt-channel-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .yt-ch-tab {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .18s ease;
    }

    .yt-ch-tab:hover {
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
      color: var(--text);
    }

    .yt-ch-tab.active {
      background: color-mix(in srgb, var(--accent) 15%, var(--panel));
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }
  </style>

</head>

<body>
  <!-- Global Root Window Config -->
  <script src="../shared/guma-core.js"></script>
  <script>window.GUMA = { root: '../', page: 'youtube' };</script>
  <script src="../shared/topbar.js" defer></script>

  <header class="topbar">
    <div class="topbar-left">
      <h1 class="title">
        <span class="title-icon icon-svg" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#ff4b4b">
            <path
              d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
          </svg>
        </span>
        YouTube
      </h1>
    </div>
    <div class="topbar-right">
      <a class="btn icon-btn" href="../" aria-label="홈으로">
        <span class="icon-svg" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9,22 9,12 15,12 15,22" />
          </svg></span>
      </a>
      <button id="themeToggle" class="btn icon-btn" type="button" aria-label="모드 토글">
        <span class="icon-svg" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg></span>
      </button>
      <button id="openSidepanel" class="btn icon-btn" type="button" aria-label="메뉴">
        <span class="icon-svg" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg></span>
      </button>
    </div>
  </header>

  <div id="sidepanelOverlay" class="sidepanel-overlay"></div>
  <aside id="sidepanel" class="sidepanel" aria-label="메뉴">
    <div class="sidepanel-title">메뉴</div>
    <div id="sidepanel-nav" class="sidepanel-actions"></div>
  </aside>

  <!-- Video Detail & Download Modal (내부 팝업) -->
  <div id="yt-modal" class="yt-modal-overlay" aria-hidden="true">
    <div class="yt-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="yt-modal-title">
      <div class="yt-modal-header">
        <h3 id="yt-modal-title" class="yt-modal-heading">
          <span class="icon-svg" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#ff4b4b">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
            </svg>
          </span>
          <span>영상 상세 및 다운로드</span>
        </h3>
        <button id="yt-modal-close" class="yt-modal-close" type="button" aria-label="닫기">&times;</button>
      </div>

      <!-- Input Form -->
      <div class="yt-input-group">
        <div class="yt-input-wrapper">
          <input type="text" id="yt-url" class="yt-input" placeholder="유튜브 영상 URL을 입력하거나 붙여넣으세요..." autocomplete="off">
          <button id="yt-clear" class="yt-clear-btn">&times;</button>
        </div>
        <button id="yt-analyze" class="yt-btn-analyze">
          <span>영상 분석</span>
        </button>
      </div>

      <!-- Result Card -->
      <div id="yt-result" class="yt-card">
        <div class="yt-card-content">
          <img id="yt-thumb" class="yt-thumb" src="" alt="Thumbnail">
          <div class="yt-info">
            <div>
              <div id="yt-card-title" class="yt-info-title"></div>
              <div class="yt-meta">
                <span id="yt-card-uploader">👤 -</span>
                <span id="yt-card-duration">⏱️ 00:00</span>
                <span id="yt-card-views">👁️ -</span>
                <span id="yt-card-date">📅 -</span>
                <span id="yt-card-quality" class="yt-quality-badge">HD</span>
              </div>
            </div>
            <div class="yt-actions" style="flex-wrap: wrap; gap: 8px;">
              <button id="btn-dl-mp4" class="yt-dl-btn" style="flex: 1 1 140px; font-weight: 700;">🎬 MP4 다운로드</button>
              <button id="btn-dl-mp3" class="yt-dl-btn" style="flex: 1 1 140px; font-weight: 700;">🎵 MP3 다운로드</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="yt-container">
    <!-- YouTube Channel Recent Videos (전면 배치) -->
    <div class="yt-channel-section">
      <div class="yt-channel-header">
        <h2 class="yt-channel-title">📺 최근 영상</h2>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button id="btnSubOpenUrlModal" class="yt-header-action-btn" type="button" aria-label="URL 직접 입력">
            <span>🔗 직접 URL 입력</span>
          </button>
          <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="yt-header-action-btn" aria-label="YouTube 공식 사이트 새 탭 열기" style="text-decoration: none;">
            <span class="icon-svg" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#ff4b4b">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
              </svg>
            </span>
            <span>YouTube</span>
          </a>
        </div>
      </div>

      <!-- Channel Tabs Bar -->
      <div id="yt-channel-bar" class="yt-channel-bar"></div>

      <!-- Video Grid & Loader -->
      <div id="rs-billiards-list" class="yt-channel-grid"></div>
      <div id="rs-billiards-loader" class="yt-channel-loading" style="margin-top: 16px;">최근 영상을 불러오는 중...</div>
    </div>
  </div>

  <script>
    // 백엔드 API 주소 결정 (로컬 환경 vs GitHub Pages 환경)
    function getApiBase() {
      if (window.GumaCore && window.GumaCore.getApiBase) {
        return window.GumaCore.getApiBase();
      }
      return window.location.origin;
    }

    const API_BASE = getApiBase();
    let currentVideoUrl = '';

    const ytModal = document.getElementById('yt-modal');
    const modalCloseBtn = document.getElementById('yt-modal-close');
    const btnSubOpenUrlModal = document.getElementById('btnSubOpenUrlModal');

    const urlInput = document.getElementById('yt-url');
    const clearBtn = document.getElementById('yt-clear');
    const analyzeBtn = document.getElementById('yt-analyze');
    const resultCard = document.getElementById('yt-result');

    // 팝업 내부 폼 및 결과 카드 완전 초기화 함수
    function resetModalForm() {
      currentVideoUrl = '';
      if (urlInput) urlInput.value = '';
      if (clearBtn) clearBtn.style.display = 'none';
      if (resultCard) resultCard.style.display = 'none';
      if (analyzeBtn) {
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = '<span>영상 분석</span>';
      }
      const thumb = document.getElementById('yt-thumb');
      if (thumb) thumb.src = '';
      const title = document.getElementById('yt-card-title');
      if (title) title.textContent = '';
      const uploader = document.getElementById('yt-card-uploader');
      if (uploader) uploader.textContent = '👤 -';
      const duration = document.getElementById('yt-card-duration');
      if (duration) duration.textContent = '⏱️ 00:00';
      const views = document.getElementById('yt-card-views');
      if (views) views.textContent = '👁️ -';
      const date = document.getElementById('yt-card-date');
      if (date) date.textContent = '📅 -';
    }

    // 내부 팝업(모달) 열기/닫기 제어
    function openModal(previewData = null) {
      if (!ytModal) return;
      ytModal.classList.add('open');
      ytModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';

      if (previewData) {
        analyzeVideo(previewData.url, previewData);
      } else {
        // [직접 URL 입력] 버튼으로 열었을 때는 이전 영상 정보를 깨끗하게 초기화
        resetModalForm();
        setTimeout(() => {
          if (urlInput) urlInput.focus();
        }, 120);
      }
    }

    function closeModal() {
      if (!ytModal) return;
      ytModal.classList.remove('open');
      ytModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      resetModalForm();
    }

    if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeModal);
    if (ytModal) {
      ytModal.addEventListener('click', (e) => {
        if (e.target === ytModal) closeModal();
      });
    }
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && ytModal && ytModal.classList.contains('open')) {
        closeModal();
      }
    });

    if (btnSubOpenUrlModal) btnSubOpenUrlModal.addEventListener('click', () => openModal());

    // 입력창 클리어 버튼 제어
    urlInput.addEventListener('input', () => {
      clearBtn.style.display = urlInput.value ? 'block' : 'none';
    });
    clearBtn.addEventListener('click', () => {
      urlInput.value = '';
      clearBtn.style.display = 'none';
      resultCard.style.display = 'none';
      urlInput.focus();
    });

    // 시간 포맷팅 (초 -> H:MM:SS 또는 MM:SS)
    function formatDuration(seconds) {
      if (!seconds) return '00:00';
      const sec = Math.floor(Number(seconds) || 0);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = (n) => n < 10 ? '0' + n : n;
      if (h > 0) {
        return `${h}:${pad(m)}:${pad(s)}`;
      }
      return `${m}:${pad(s)}`;
    }

    // 로드된 최근 영상 메타데이터 캐시 (빠른 미리보기 및 누락 데이터 보완)
    const loadedVideosMap = new Map();

    // 영상 분석 공통 함수 (선택된 카드의 사전 메타데이터가 있으면 즉시 렌더링 후 백엔드 분석)
    async function analyzeVideo(targetUrl, previewData = null) {
      const url = (targetUrl || urlInput.value).trim();
      if (!url) {
        alert('유튜브 URL을 입력하세요.');
        return;
      }

      urlInput.value = url;
      clearBtn.style.display = 'block';

      // previewData가 없는 경우 로드된 영상 맵에서 검색
      if (!previewData) {
        if (loadedVideosMap.has(url)) {
          previewData = loadedVideosMap.get(url);
        } else {
          for (const [key, val] of loadedVideosMap.entries()) {
            if (val.id && url.includes(val.id)) {
              previewData = val;
              break;
            }
          }
        }
      }

      currentVideoUrl = url;

      // 카드를 클릭했거나 캐시된 영상 정보가 있다면 즉시 상단 결과 카드에 올바른 정보 선반영
      if (previewData) {
        if (previewData.thumbnail) document.getElementById('yt-thumb').src = previewData.thumbnail;
        if (previewData.title) document.getElementById('yt-card-title').textContent = previewData.title;
        const chName = previewData.channel_name || previewData.uploader || '유튜브 채널';
        document.getElementById('yt-card-uploader').textContent = `👤 ${chName}`;
        
        const durText = previewData.duration_text || (previewData.duration ? formatDuration(previewData.duration) : '');
        if (durText) {
          document.getElementById('yt-card-duration').textContent = `⏱️ ${durText}`;
        }

        let pViews = '-';
        if (previewData.view_count) {
          pViews = previewData.view_count >= 10000 
            ? (previewData.view_count / 10000).toFixed(1) + '만회' 
            : previewData.view_count.toLocaleString() + '회';
        } else if (previewData.views_text) {
          pViews = previewData.views_text.includes('회') ? previewData.views_text : `${previewData.views_text}회`;
        }
        document.getElementById('yt-card-views').textContent = `👁️ ${pViews}`;
        document.getElementById('yt-card-date').textContent = previewData.time_text || previewData.published || (previewData.upload_date ? `📅 ${previewData.upload_date}` : '');
        document.getElementById('yt-card-quality').textContent = 'HD';
        resultCard.style.display = 'block';

        // 카드에서 선택한 영상은 이미 모든 정보(제목, 시간, 채널, 조회수 등)가 확보되어 있으므로 불필요한 2중 백엔드 조회를 생략합니다.
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = '<span>영상 분석</span>';
        return;
      } else {
        resultCard.style.display = 'none';
      }

      analyzeBtn.disabled = true;
      analyzeBtn.innerHTML = '<span>분석 중...</span>';

      try {
        const res = await fetch(`${API_BASE}/api/youtube/info`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || '분석 실패');
        }

        currentVideoUrl = url;
        if (data.thumbnail) document.getElementById('yt-thumb').src = data.thumbnail;
        if (data.title) document.getElementById('yt-card-title').textContent = data.title;
        if (data.uploader && data.uploader !== '알 수 없는 채널') {
          document.getElementById('yt-card-uploader').textContent = `👤 ${data.uploader}`;
        }

        // 재생시간 반영
        if (data.duration && data.duration > 0) {
          document.getElementById('yt-card-duration').textContent = `⏱️ ${formatDuration(data.duration)}`;
        } else {
          document.getElementById('yt-card-duration').textContent = `⏱️ ${formatDuration(data.duration)}`;
        }

        // 조회수 포맷팅
        if (data.view_count && data.view_count > 0) {
          let viewsStr = '-';
          if (data.view_count >= 10000) {
            viewsStr = (data.view_count / 10000).toFixed(1) + '만회';
          } else {
            viewsStr = data.view_count.toLocaleString() + '회';
          }
          document.getElementById('yt-card-views').textContent = `👁️ ${viewsStr}`;
        }

        if (data.upload_date) {
          document.getElementById('yt-card-date').textContent = `📅 ${data.upload_date}`;
        }
        document.getElementById('yt-card-quality').textContent = data.quality || 'HD';

        resultCard.style.display = 'block';
      } catch (err) {
        // 이미 previewData로 카드가 렌더링된 상태라면 완전 실패 alert 대신 유지하거나 안내
        if (!previewData) {
          alert(`오류: ${err.message}`);
        }
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = '<span>영상 분석</span>';
      }
    }

    // 영상 분석 버튼 클릭
    analyzeBtn.addEventListener('click', () => analyzeVideo());

    const ALL_FEED_ID = '__ALL_FEED__';
    let channelsList = [];
    let activeChannelUrl = ALL_FEED_ID;

    // 상대 시간 계산 (예: 24분 전, 3시간 전, 2일 전)
    function formatRelativeTime(dateOrStr) {
      if (!dateOrStr) return '';
      if (typeof dateOrStr === 'string' && (dateOrStr.includes('전') || dateOrStr.includes('ago') || dateOrStr.includes('스트리밍') || dateOrStr.includes('라이브'))) {
        return dateOrStr;
      }
      try {
        const published = new Date(dateOrStr);
        if (isNaN(published.getTime())) return String(dateOrStr);
        const now = new Date();
        const diffSec = Math.floor((now - published) / 1000);
        if (diffSec < 60) return '방금 전';
        const diffMin = Math.floor(diffSec / 60);
        if (diffMin < 60) return `${diffMin}분 전`;
        const diffHour = Math.floor(diffMin / 60);
        if (diffHour < 24) return `${diffHour}시간 전`;
        const diffDay = Math.floor(diffHour / 24);
        if (diffDay < 7) return `${diffDay}일 전`;
        const diffWeek = Math.floor(diffDay / 7);
        if (diffWeek < 5) return `${diffWeek}주 전`;
        const diffMonth = Math.floor(diffDay / 30);
        if (diffMonth < 12) return `${diffMonth}개월 전`;
        const diffYear = Math.floor(diffDay / 365);
        return `${diffYear}년 전`;
      } catch (e) {
        return '';
      }
    }

    function getYoutubeCacheKey() {
      const profile = (window.GumaCore && window.GumaCore.getActiveProfile()) || localStorage.getItem('guma_active_profile') || 'default';
      return `guma_cache_youtube_${profile}`;
    }

    function initChannelsFromCache() {
      try {
        const raw = localStorage.getItem(getYoutubeCacheKey());
        if (raw) {
          const cached = JSON.parse(raw);
          const list = cached.channels || (Array.isArray(cached) ? cached : null);
          if (list && list.length > 0) {
            channelsList = list;
            renderChannelTabs();
            return true;
          }
        }
      } catch {}
      return false;
    }

    async function initChannels() {
      // 1단계 (0ms): 브라우저 캐시에서 즉시 채널 탭 복원
      initChannelsFromCache();

      // 2단계: 터널 확인
      if (window.GumaCore && window.GumaCore.discoverActiveTunnel) {
        try { await window.GumaCore.discoverActiveTunnel(); } catch {}
      }

      // 3단계: 백그라운드 DB 동기화
      try {
        if (window.GumaCore && window.GumaCore.fetchProfileConfig) {
          const dbData = await window.GumaCore.fetchProfileConfig('youtube_channels');
          if (dbData) {
            channelsList = dbData.channels || (Array.isArray(dbData) ? dbData : []);
            try { localStorage.setItem(getYoutubeCacheKey(), JSON.stringify({ channels: channelsList })); } catch {}
            renderChannelTabs();
          }
        }
      } catch (e) {
        console.warn('[YouTube] 채널 목록 최신화 건너뜀 (캐시 유지):', e);
      }

      activeChannelUrl = ALL_FEED_ID;
      renderChannelTabs();
      resetAndLoadChannel();
    }

    function renderChannelTabs() {
      const bar = document.getElementById('yt-channel-bar');
      if (!bar) return;
      bar.innerHTML = '';

      if (!channelsList || channelsList.length === 0) {
        bar.innerHTML = '<div style="color:var(--muted); font-size:13px; padding:8px 0;">등록된 채널이 없습니다. <a href="../config/?tab=youtube" style="color:var(--accent); text-decoration:underline;">환경설정</a>에서 관심 채널을 추가해 보세요.</div>';
        const container = document.getElementById('rs-billiards-list');
        if (container) container.innerHTML = '';
        const loader = document.getElementById('rs-billiards-loader');
        if (loader) loader.style.display = 'none';
        return;
      }

      // 1. 전체 탭
      const allTab = document.createElement('div');
      allTab.className = `yt-ch-tab ${activeChannelUrl === ALL_FEED_ID ? 'active' : ''}`;
      allTab.innerHTML = `<span>📺 전체</span>`;
      allTab.addEventListener('click', () => {
        if (activeChannelUrl !== ALL_FEED_ID) {
          activeChannelUrl = ALL_FEED_ID;
          renderChannelTabs();
          resetAndLoadChannel();
        }
      });
      bar.appendChild(allTab);

      // 2. 개별 채널 탭 목록
      channelsList.forEach(ch => {
        const tab = document.createElement('div');
        tab.className = `yt-ch-tab ${ch.url === activeChannelUrl ? 'active' : ''}`;
        tab.innerHTML = `<span>${ch.name}</span>`;

        tab.addEventListener('click', () => {
          if (activeChannelUrl !== ch.url) {
            activeChannelUrl = ch.url;
            renderChannelTabs();
            resetAndLoadChannel();
          }
        });

        bar.appendChild(tab);
      });
    }

    let renderedVideoIds = new Set();

    function resetAndLoadChannel() {
      const container = document.getElementById('rs-billiards-list');
      const loader = document.getElementById('rs-billiards-loader');
      if (container) container.innerHTML = '';
      renderedVideoIds.clear();
      chOffset = 0;
      chHasMore = true;
      chLoading = false;

      if (!channelsList || channelsList.length === 0) {
        if (loader) loader.style.display = 'none';
        return;
      }

      // 첫 번째 목록은 번거로운 버튼 클릭 없이 자동으로 즉시 조회
      loadMoreChannelVideos();
    }

    // 최근 영상 페이징 로딩
    let chOffset = 0;
    let chLoading = false;
    let chHasMore = true;

    async function loadMoreChannelVideos() {
      if (chLoading || !chHasMore) return;

      const loader = document.getElementById('rs-billiards-loader');
      const container = document.getElementById('rs-billiards-list');

      if (!channelsList || channelsList.length === 0) {
        if (container) container.innerHTML = '';
        if (loader) loader.style.display = 'none';
        chHasMore = false;
        return;
      }

      chLoading = true;
      loader.style.display = 'block';
      loader.innerHTML = '<span>영상을 불러오는 중...</span>';

      try {
        let res, data;
        const isFeed = (activeChannelUrl === ALL_FEED_ID);

        if (isFeed) {
          // 전체 구독 피드 요청 (여러 채널 통합 최신순)
          res = await fetch(`${API_BASE}/api/youtube/feed`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              channels: channelsList,
              offset: chOffset,
              limit: 10
            })
          });
        } else {
          // 단일 채널 영상 목록 요청
          res = await fetch(`${API_BASE}/api/youtube/channel`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              channel_url: activeChannelUrl,
              offset: chOffset,
              limit: 10
            })
          });
        }

        data = await res.json();
        if (!res.ok || !data.videos) throw new Error(data.detail || '로딩 실패');

        if (data.videos.length === 0 && chOffset === 0) {
          loader.innerHTML = '<span>불러올 영상이 없습니다.</span>';
          chHasMore = false;
          return;
        }

        data.videos.forEach(v => {
          const vKey = v.id || v.url;
          if (vKey && renderedVideoIds.has(vKey)) {
            return; // 이미 화면에 렌더링된 영상은 100% 중복 노출 차단
          }
          if (vKey) renderedVideoIds.add(vKey);

          if (v.url) loadedVideosMap.set(v.url, v);
          if (v.id) loadedVideosMap.set(v.id, v);

          const card = document.createElement('div');
          card.className = 'yt-ch-card';

          const relTime = formatRelativeTime(v.time_text || v.published);
          const durationStr = v.duration_text || (v.duration ? formatDuration(v.duration) : '');
          const chBadgeHtml = (v.channel_name)
            ? `<div class="yt-ch-badge">📺 ${v.channel_name}</div>`
            : '';

          card.innerHTML = `
            <div>
              <div class="yt-thumb-wrap">
                <img class="yt-ch-thumb" src="${v.thumbnail}" alt="${v.title}" loading="lazy">
              </div>
              ${chBadgeHtml}
              <div class="yt-ch-title" title="${v.title}">${v.title}</div>
              <div class="yt-ch-meta">
                <span>${durationStr ? '⏱️ ' + durationStr : ''}</span>
                <span>${relTime ? '🕒 ' + relTime : ''}</span>
              </div>
            </div>
          `;

          // 썸네일(카드) 클릭 시 내부 팝업(모달)으로 상세 정보 및 다운로드 제공
          card.addEventListener('click', () => {
            openModal(v);
          });

          container.appendChild(card);
        });

        chOffset += data.videos.length;
        chHasMore = data.has_more;

        if (!chHasMore) {
          loader.innerHTML = '<span style="color:var(--muted); font-size:13px;">모든 최근 영상을 불러왔습니다.</span>';
        } else {
          loader.innerHTML = `
            <button id="btn-load-more" class="yt-btn-load-more" onclick="loadMoreChannelVideos()">
              <span>⬇️ 영상 더보기 (${chOffset}개 로드됨)</span>
            </button>
          `;
        }
      } catch (e) {
        loader.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
            <span style="color:var(--danger); font-size:13px;">최근 영상을 불러오지 못했습니다. (백엔드 서버 상태 확인 필요)</span>
            <button class="yt-btn-load-more" onclick="loadMoreChannelVideos()">
              <span>🔄 다시 시도</span>
            </button>
          </div>
        `;
      } finally {
        chLoading = false;
      }
    }

    initChannels();

    // 유튜브 자체 다운로드 실행 함수 (Blob 스트리밍으로 사이트 내에서 직접 저장)
    async function triggerDownload(formatType) {
      if (!currentVideoUrl) {
        alert('먼저 영상을 선택하거나 URL을 분석하세요.');
        return;
      }

      const mp4Btn = document.getElementById('btn-dl-mp4');
      const mp3Btn = document.getElementById('btn-dl-mp3');
      const targetBtn = formatType === 'mp4' ? mp4Btn : mp3Btn;
      const originalText = targetBtn.innerHTML;

      targetBtn.disabled = true;
      mp4Btn.disabled = true;
      mp3Btn.disabled = true;
      targetBtn.innerHTML = `<span>⏳ 다운로드 중...</span>`;

      try {
        const downloadUrl = `${API_BASE}/api/youtube/download?url=${encodeURIComponent(currentVideoUrl)}&format_type=${formatType}`;
        const response = await fetch(downloadUrl);

        if (!response.ok) {
          let errDetail = '다운로드에 실패했습니다.';
          try {
            const errData = await response.json();
            errDetail = errData.detail || errDetail;
          } catch (_) {
            errDetail = `HTTP ${response.status} 오류가 발생했습니다.`;
          }
          throw new Error(errDetail);
        }

        targetBtn.innerHTML = `<span>💾 파일 저장 중...</span>`;
        const blob = await response.blob();
        
        // 1순위: 현재 카드에 표시된 실제 영상 제목 가져오기
        const currentTitle = document.getElementById('yt-card-title')?.textContent?.trim() || '';
        const safeTitle = currentTitle.replace(/[\\/:*?"<>|]/g, '_');
        let filename = safeTitle ? `${safeTitle}.${formatType}` : `youtube_${formatType}_${Date.now()}.${formatType}`;

        // 2순위: Content-Disposition 헤더가 있으면 디코딩 적용
        const disposition = response.headers.get('content-disposition') || '';
        if (disposition) {
          const matchUtf8 = disposition.match(/filename\*=UTF-8''([^;\n]*)/i);
          const matchNormal = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/i);
          if (matchUtf8 && matchUtf8[1]) {
            filename = decodeURIComponent(matchUtf8[1]);
          } else if (matchNormal && matchNormal[1]) {
            filename = decodeURIComponent(matchNormal[1].replace(/['"]/g, ''));
          }
        }


        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(blobUrl);

        // 다운로드 완료 시점: 완료 알림 후 팝업(모달) 자동 닫기
        targetBtn.innerHTML = `<span>✅ 다운로드 완료!</span>`;
        setTimeout(() => {
          closeModal();
        }, 600);

      } catch (err) {
        alert(`다운로드 오류:\n${err.message}`);
      } finally {
        setTimeout(() => {
          targetBtn.innerHTML = originalText;
          mp4Btn.disabled = false;
          mp3Btn.disabled = false;
        }, 650);
      }
    }

    document.getElementById('btn-dl-mp4').addEventListener('click', () => triggerDownload('mp4'));
    document.getElementById('btn-dl-mp3').addEventListener('click', () => triggerDownload('mp3'));



  </script>
</body>
